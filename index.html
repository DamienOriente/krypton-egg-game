<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070c" />
    <title>Krypton Egg — Remake</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #05070c;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
        aspect-ratio: 16 / 9;
        width: min(100vw, calc(100vh * 16 / 9));
        height: auto;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="2560" height="1440" tabindex="0"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
